context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Picasso Speaker (DSP)"
            media.name       = "Picasso Speaker (DSP)"
            filter.graph = {
                nodes = [
                    {
                        type   = builtin
                        name   = preamp
                        label  = bq_highshelf
                        config = { Freq = 20.0 Q = 0.707 Gain = 0.0 }
                    }
                    {
                        type   = builtin
                        name   = hpf
                        label  = bq_highpass
                        config = { Freq = 130.0 Q = 0.707 }
                    }
                    {
                        type   = builtin
                        name   = warmth
                        label  = bq_lowshelf
                        config = { Freq = 190.0 Q = 0.8 Gain = 4.0 }
                    }
                    {
                        type   = builtin
                        name   = debox
                        label  = bq_peaking
                        config = { Freq = 450.0 Q = 1.2 Gain = -1.5 }
                    }
                    {
                        type   = builtin
                        name   = deharsh
                        label  = bq_peaking
                        config = { Freq = 2900.0 Q = 1.4 Gain = -3.8 }
                    }
                    {
                        type   = builtin
                        name   = smooth_hi
                        label  = bq_peaking
                        config = { Freq = 5500.0 Q = 1.5 Gain = -1.5 }
                    }
                    {
                        type   = builtin
                        name   = air
                        label  = bq_highshelf
                        config = { Freq = 8500.0 Q = 0.7 Gain = 2.0 }
                    }
                ]
                links = [
                    { output = "preamp:Out"    input = "hpf:In" }
                    { output = "hpf:Out"       input = "warmth:In" }
                    { output = "warmth:Out"    input = "debox:In" }
                    { output = "debox:Out"     input = "deharsh:In" }
                    { output = "deharsh:Out"   input = "smooth_hi:In" }
                    { output = "smooth_hi:Out" input = "air:In" }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "picasso_speaker_dsp"
                media.class      = Audio/Sink
                priority.session = 1005
                audio.channels   = 2
                audio.position   = [ FL FR ]
                node.linger      = true
            }
            playback.props = {
                node.name         = "picasso_speaker_dsp_out"
                node.target       = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.passive      = true
                stream.dont-remix = true
                audio.channels    = 2
                audio.position    = [ FL FR ]
            }
        }
    }
]
