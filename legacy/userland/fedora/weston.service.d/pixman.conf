# Until the Adreno 620 submit hang is fixed (see STATUS.md), run the compositor
# on the CPU renderer: with gl-renderer every frame is a GPU submission that the
# hangcheck recovers, the atomic commit never completes, and the screen stays
# black while weston sits blocked. With pixman there are no GPU submissions at
# all, the DPU commits normally and the UI appears (slower, but stable).
[Service]
ExecStart=
ExecStart=/usr/bin/weston --backend=drm-backend.so --renderer=pixman --idle-time=0 --debug
